[project]
name = "{{study}}"
version = "0.1.0"
description = "A study of the {{workspace}} workspace: its question is in PLAN.md"
# {{requires_python}}
dependencies = [
# {{library_dependency}}
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

# {{library_source}}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["study"]
