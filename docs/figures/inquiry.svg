<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Inside an inquiry: sources, wiki, code</title>
  <desc id="desc">Sources are digested into the wiki; code changes update the wiki; the agent reads the wiki's index first.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .wiki { fill: #eef6ff; stroke: #0969da; stroke-width: 2; }
    .title { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .sub { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59636e; }
    .file { font: 13.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #1f2328; }
    .note { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59636e; }
    .edge { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    .label { font: italic 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .agent { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .wiki { fill: #0c2d6b; stroke: #4493f8; }
      .title, .file, .label { fill: #e6edf3; }
      .sub, .note { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .agent { fill: #3b2e00; stroke: #d29922; }
    }
  </style>
  <rect class="bg" width="940" height="330" rx="8"/>

  <!-- Sources -->
  <rect class="box" x="20" y="20" width="240" height="190" rx="10"/>
  <text class="title" x="38" y="50">Sources</text>
  <text class="sub" x="38" y="70">what the inquiry reads</text>
  <text class="file" x="38" y="102">references.bib</text>
  <text class="file" x="38" y="126">resources.yaml</text>
  <text class="file" x="38" y="150">resources/</text>
  <text class="note" x="38" y="172">the pool: PDFs, code, data</text>
  <text class="note" x="38" y="191">outside git, read-only</text>

  <!-- Wiki -->
  <rect class="wiki" x="350" y="20" width="240" height="190" rx="10"/>
  <text class="title" x="368" y="50">Wiki</text>
  <text class="sub" x="368" y="70">what the inquiry knows</text>
  <text class="file" x="368" y="102">docs/wiki/index.md</text>
  <text class="file" x="386" y="126">concepts/  sources/</text>
  <text class="file" x="386" y="150">phases/</text>
  <text class="file" x="368" y="174">docs/findings/</text>
  <text class="note" x="368" y="193">Markdown, read in Obsidian</text>

  <!-- Code -->
  <rect class="box" x="680" y="20" width="240" height="190" rx="10"/>
  <text class="title" x="698" y="50">Code</text>
  <text class="sub" x="698" y="70">what the inquiry runs</text>
  <text class="file" x="698" y="102">phases/NN-slug/</text>
  <text class="note" x="698" y="122">one folder per phase</text>
  <text class="file" x="698" y="150">runs/</text>
  <text class="note" x="698" y="170">outputs, outside git</text>
  <text class="note" x="698" y="191">tested, versioned</text>

  <!-- Sources → Wiki: digest -->
  <line class="edge" x1="264" y1="128" x2="336" y2="128"/>
  <polygon class="head" points="346,128 334,122 334,134"/>
  <text class="label" x="305" y="116" text-anchor="middle">digest</text>

  <!-- Code → Wiki: update -->
  <line class="edge" x1="676" y1="128" x2="604" y2="128"/>
  <polygon class="head" points="594,128 606,122 606,134"/>
  <text class="label" x="635" y="116" text-anchor="middle">update</text>

  <!-- Agent → Wiki: reads index.md first -->
  <rect class="agent" x="385" y="262" width="170" height="44" rx="22"/>
  <text class="title" x="470" y="290" text-anchor="middle">Agent</text>
  <line class="edge" x1="470" y1="260" x2="470" y2="222"/>
  <polygon class="head" points="470,212 464,224 476,224"/>
  <text class="label" x="482" y="243">reads index.md first</text>
  <text class="note" x="20" y="275">AGENTS.md: the rules</text>
  <text class="note" x="20" y="295">.agents/skills/: digest, update,</text>
  <text class="note" x="20" y="315">publish, spawn…</text>
  <text class="note" x="680" y="275">inquiry.yaml: the question,</text>
  <text class="note" x="680" y="295">the parent, the sub-inquiries</text>
</svg>
