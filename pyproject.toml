[project]
name = "research-project"
version = "0.1.0"
description = "Rename me"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
fetch = "fetch.cli:main"
refs = "fetch.refs:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_project", "tools/fetch"]
