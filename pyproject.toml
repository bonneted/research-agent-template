[project]
name = "research-knowledge-tree"
version = "2.0.1"
description = "The kit of the knowledge tree, and rkt: references, resources and checks of an inquiry"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
rkt = "rkt.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/rkt"]

[tool.hatch.build.targets.wheel.force-include]
"kit" = "rkt/kit"
